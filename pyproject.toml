[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "empleo-arg"
version = "0.1.0"
description = "Governed adapters for official INDEC EPH labor-market state"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "openpyxl>=3.1",
  "xlrd>=2.0.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
empleo-arg = "empleo_arg.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
